}
function setBusy(on) {
  ui.busy = on;
  app.querySelectorAll("form button, .owner-row button, .rowner button, .banner-owner button").forEach(b => { b.disabled = on; });
}
async function commit(next, msgEl, okText, draft) {
  if (ui.busy) return false;
  if (!ui.artifact) { setMsg(msgEl, "Saving isn’t available in this view.", "err"); return false; }
  setBusy(true);
  setMsg(msgEl, "Saving…");
  if (draft) { try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) { /* storage unavailable */ } }
  try {
    await ui.artifact.publish(buildDocument(next));
    setMsg(msgEl, okText, "ok");
    return true;
  } catch (e) {
    setBusy(false);
    const code = e && e.code;
    const readOnly = ["not_writer", "not_granted", "consent_required", "capability_disabled", "not_declared"].includes(code);
    const text = code === "conflict" ? "A newer version of the site was saved somewhere else, so this change wasn’t saved. The page is reloading to that version."
      : readOnly ? "This view can’t save changes."
      : code === "rate_limited" ? "Too many saves in a short time. Wait a minute, then try again."
      : code === "too_large" ? "The site’s data has grown too large to save."
      : "The save didn’t go through. Try again in a moment.";
    setMsg(msgEl, text, "err");
    return false;
  }
}
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { d = null; }
  if (!d) return;
  try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
  if (d.kind !== "log" || DATA.matches.some(m => m.id === d.id)) return;
  openPanel("log", false);
  Object.keys(d.values || {}).forEach(id => { const el = document.getElementById(id); if (el) el.value = d.values[id]; });
  updateLogPreview();
  setMsg($("#log-msg"), "This prediction wasn’t saved last time. Check the details and save it again.", "err");
}

/* ===== Interaction ===== */
function goTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
}
function toggleMenu(force) {
  const nav = $("#site-nav"), btn = $(".menu-btn");
  if (!nav || !btn) return;
  const open = force == null ? !nav.classList.contains("open") : force;
  nav.classList.toggle("open", open);
  btn.setAttribute("aria-expanded", String(open));
}
function selectMatch(id, scroll) {
  const m = DATA.matches.find(x => x.id === id);
  if (!m) return;
  ui.selectedId = id;
  const sel = $("#match-select"), body = $("#analysis-body");
  if (sel) sel.value = id;
  if (body) body.innerHTML = AnalysisBody(m).s;
  if (scroll) goTo("analysis");
}
function openPanel(name, scroll) {
  const el = document.getElementById("panel-" + name);
  if (!el) return;
  el.hidden = false;
  if (scroll !== false) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
  const first = el.querySelector("input, textarea");
  if (first) setTimeout(() => first.focus({ preventScroll: true }), reduceMotion ? 0 : 350);
}
function closePanel(name) { const el = document.getElementById("panel-" + name); if (el) el.hidden = true; }
function confirmStep(btn, text) {
  if (btn.dataset.armed === "1") return true;
  const original = btn.textContent;
  btn.dataset.armed = "1";
  btn.textContent = text;
  setTimeout(() => { if (btn.isConnected && !ui.busy) { btn.dataset.armed = ""; btn.textContent = original; } }, 4000);
  return false;
}
async function copyText(text, msgEl, label) {
  try {
    await navigator.clipboard.writeText(text);
    setMsg(msgEl, label + " copied to your clipboard.", "ok");
  } catch (e) {
    const area = $("#export-area");
    area.hidden = false; area.value = text; area.focus(); area.select();
    setMsg(msgEl, "Copying is blocked here. The data is selected below, so press Ctrl+C or ⌘C.", "err");
  }
}
function onClick(e) {
  const nav = e.target.closest("a[data-nav]");
  if (nav) { e.preventDefault(); toggleMenu(false); goTo(nav.dataset.nav); return; }
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const id = btn.dataset.id, act = btn.dataset.action, rowMsg = id ? document.getElementById("msg-" + id) : null;
  if (act.indexOf("g-") === 0) { playAction(btn); return; }
  switch (act) {
    case "menu": toggleMenu(); break;
    case "analyze": selectMatch(id, true); break;
    case "toggle-results": ui.showAll = !ui.showAll; $("#results-list").innerHTML = ResultsList(shownMatches()).s; break;
    case "open": openPanel(btn.dataset.panel); break;
    case "close": closePanel(btn.dataset.panel); break;
    case "save-result": saveResult(id); break;
    case "delete":
      if (confirmStep(btn, "Click again to delete")) changeMatch(id, rowMsg, (m, next) => {
        if (Date.parse(m.kickoff) <= Date.now()) return "Kickoff has passed, so this prediction stays on the record.";
        next.matches = next.matches.filter(x => x.id !== id);
      }, "Deleted. Updating the page…");
      break;
    case "postpone":
      if (confirmStep(btn, "Click again to confirm")) changeMatch(id, rowMsg, m => { m.result = { status: "postponed" }; }, "Marked as postponed. Updating the page…");
      break;
    case "reopen":
      if (confirmStep(btn, "Click again to reopen")) changeMatch(id, rowMsg, m => { m.result = null; }, "Reopened. Updating the page…");
      break;
    case "remove-sample":
      if (confirmStep(btn, "Click again to remove")) { const next = clone(DATA); next.matches = next.matches.filter(m => !m.sample); commit(next, $("#owner-msg"), "Sample data removed. Updating the page…"); }
      break;
    case "copy-csv": copyText(toCSV(), $("#export-msg"), "CSV"); break;
    case "copy-json": copyText(JSON.stringify(exportData(), null, 2), $("#export-msg"), "JSON"); break;
    case "export-site": exportSite(); break;
  }
}
function onInput(e) {
  if (e.target.id === "g-name") { setClubName(e.target.value, false); return; }
  if (e.target.closest("#panel-log")) updateLogPreview();
  if (e.target.closest("#panel-version")) updateVersionTotal();
}
function onChange(e) {
  if (e.target.id === "match-select") selectMatch(e.target.value, false);
  if (e.target.id === "g-name") setClubName(e.target.value, true);
}
function onSubmit(e) {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  if (ui.busy) return;
  ({ log: submitLog, version: submitVersion, settings: submitSettings })[form.dataset.form]();
}
function setupNavObserver() {
  if (ui.navObserver) ui.navObserver.disconnect();
  if (!("IntersectionObserver" in window)) return;
  const links = Array.from(document.querySelectorAll(".nav a[data-nav]"));
  ui.navObserver = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle("active", a.dataset.nav === en.target.id)); });
  }, { rootMargin: "-40% 0px -55% 0px" });
  NAV.forEach(([id]) => { const s = document.getElementById(id); if (s) ui.navObserver.observe(s); });
}

/* ===== Render & boot ===== */
function render() {
  app.innerHTML = html`${Header()}${SampleBanner()}${OwnerBar()}<main id="main">${Hero()}${PredictionsSection()}${TrackRecordSection()}${AnalysisSection()}${PlaySection()}${MethodologySection()}${DevelopmentSection()}${DataSection()}${AboutSection()}</main>${Footer()}`.s;
  drawChart();
  afterPlayRender();
  setupNavObserver();
  updateLogPreview();
  updateVersionTotal();
}
app.addEventListener("click", onClick);
app.addEventListener("input", onInput);
app.addEventListener("change", onChange);
app.addEventListener("submit", onSubmit);
let resizeFrame = 0;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    const el = document.getElementById("acc-chart");
    if (el && Math.floor(el.clientWidth) !== ui.chartWidth) drawChart();
    const gh = document.getElementById("g-hist");
    if (gh && Math.max(260, Math.floor(gh.clientWidth)) !== play.histWidth) drawHistogram();
  });
});

render();
if (location.hash && /^#[a-z]+$/.test(location.hash)) setTimeout(() => goTo(location.hash.slice(1)), 60);

if (window.__PM_TEST__) window.__pm = { DATA, predict, explain, summarize, trackStats, timelineSeries, buildDocument, buildStaticDocument, toCSV, cutPoint, shownMatches, ui, render, play, makeLeague, gameOutcome, allDrafts, renderPlay, shareText };

(async function detectOwner() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [user, artifact, downloads] = await Promise.all([window.claude.use("user"), window.claude.use("artifact"), window.claude.use("downloads").catch(() => null)]);
    if (!user || !artifact) return;
    if (!(await user.canEdit())) return;
    ui.owner = true;
    ui.artifact = artifact;
    ui.downloads = downloads;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    restoreDraft();
  } catch (e) { /* stay read-only */ }
})();
})();
</script>
</body>
