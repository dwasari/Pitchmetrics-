<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="pm-style">/* Layout: a research report on a 1120px grid. Serif headings, a neutral text face and tabular numbers;
   hairline rules carry the structure, and boxes are kept for individual matches and the analysis panel.
   Blue = home, amber = away, grey = draw; pitch green is the project's only accent. */
:root{
  color-scheme:light;
  --bg:#f6f7f5; --surface:#ffffff; --surface-2:#eff2ee;
  --ink:#131a16; --ink-2:#38423d; --muted:#5d6762; --faint:#88918c;
  --line:#e0e5e0; --line-2:#c9d1ca;
  --accent:#0f6b4c; --accent-hover:#0a583e; --accent-ink:#ffffff; --accent-soft:#e2efe8;
  --home:#2160a8; --away:#b9670e; --draw:#8d9591;
  --good:#127a50; --bad:#b42318; --warn:#7f5400; --warn-bg:#fbf0d4;
  --win:#2f9e6c; --win-ink:#07130d; --loss:#b42318; --loss-ink:#ffffff;
  --shade:rgba(19,26,22,.04);
  --serif:"Newsreader","Charter","Bitstream Charter",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:8px; --header-h:60px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1412; --surface:#161c19; --surface-2:#1c2420;
  --ink:#e8ece9; --ink-2:#c3cbc6; --muted:#97a29c; --faint:#6f7a74;
  --line:#253029; --line-2:#36423b;
  --accent:#5dbb91; --accent-hover:#76c9a3; --accent-ink:#07130d; --accent-soft:#1a2b23;
  --home:#6fa6ec; --away:#e3a050; --draw:#8e9893;
  --good:#5dbb91; --bad:#f08076; --warn:#e5b95c; --warn-bg:#2a2414;
  --win:#4aa87e; --win-ink:#07130d; --loss:#bd4536; --loss-ink:#ffffff;
  --shade:rgba(255,255,255,.04);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1412; --surface:#161c19; --surface-2:#1c2420;
  --ink:#e8ece9; --ink-2:#c3cbc6; --muted:#97a29c; --faint:#6f7a74;
  --line:#253029; --line-2:#36423b;
  --accent:#5dbb91; --accent-hover:#76c9a3; --accent-ink:#07130d; --accent-soft:#1a2b23;
  --home:#6fa6ec; --away:#e3a050; --draw:#8e9893;
  --good:#5dbb91; --bad:#f08076; --warn:#e5b95c; --warn-bg:#2a2414;
  --win:#4aa87e; --win-ink:#07130d; --loss:#bd4536; --loss-ink:#ffffff;
  --shade:rgba(255,255,255,.04);
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0; color:var(--ink); line-height:1.15; text-wrap:balance}
p{margin:0}
ul,ol,dl,dd{margin:0; padding:0}
button{font:inherit; color:inherit}
a{color:var(--accent); text-decoration-thickness:1px; text-underline-offset:3px}
a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
abbr[title]{text-decoration:none; cursor:help}
.num,.ptable,.dtable,.statlist,.figures{font-variant-numeric:tabular-nums lining-nums}
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
.wrap{max-width:1120px; margin-inline:auto; padding-inline:32px}
@media (max-width:720px){ .wrap{padding-inline:20px} }
@media (max-width:400px){ .wrap{padding-inline:16px} }

/* ---------- type helpers ---------- */
.label{display:block; font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); line-height:1.4}
.fine{font-size:13px; color:var(--muted); line-height:1.5}
.muted{color:var(--muted)}
.sub-h{font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-.005em; margin-bottom:16px}
.tag-sample{display:inline-flex; align-items:center; height:22px; padding:0 7px; border-radius:4px; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}

/* ---------- header ---------- */
.site-header{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); border-bottom:1px solid var(--line)}
.header-row{height:var(--header-h); display:flex; align-items:center; justify-content:space-between; gap:24px}
.brand{display:inline-flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; flex-shrink:0}
.brand:hover{color:var(--ink)}
.brand-mark{width:22px; height:22px; color:var(--accent); flex-shrink:0}
.brand-name{font-family:var(--serif); font-weight:600; font-size:21px; letter-spacing:-.01em}
.nav{display:flex; align-items:center; gap:2px}
.nav a{font-size:14px; font-weight:500; color:var(--muted); text-decoration:none; padding:8px 10px; white-space:nowrap; border-radius:4px}
.nav a:hover{color:var(--ink)}
.nav a.active{color:var(--ink); box-shadow:inset 0 -2px 0 var(--accent); border-radius:0}
.menu-btn{display:none; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:6px 12px; font-size:14px; font-weight:600; cursor:pointer}
.menu-btn svg{width:16px; height:16px}
@media (max-width:980px){
  .menu-btn{display:inline-flex}
  .nav{display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; align-items:stretch; gap:0; padding:8px 20px 16px; background:var(--bg); border-bottom:1px solid var(--line-2); box-shadow:0 18px 30px -18px rgba(0,0,0,.35)}
  .nav.open{display:flex}
  .nav a{padding:13px 0; font-size:16px; border-bottom:1px solid var(--line); border-radius:0}
  .nav a:last-child{border-bottom:0}
  .nav a.active{box-shadow:none; color:var(--accent)}
}

/* ---------- banners ---------- */
.banner{font-size:14px; border-bottom:1px solid var(--line)}
.banner-row{display:flex; align-items:center; gap:10px 20px; flex-wrap:wrap; padding-block:10px}
.banner-sample{background:var(--warn-bg); color:var(--warn)}
.banner-sample strong{font-weight:700}
.banner-owner{background:var(--accent-soft); color:var(--ink-2)}
.banner-owner strong{color:var(--accent); font-weight:700}
.banner-actions{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
@media (max-width:720px){ .banner-actions{margin-left:0} }

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 18px; border-radius:6px; border:1px solid transparent; font-size:15px; font-weight:600; line-height:1.2; text-decoration:none; cursor:pointer; transition:background-color .15s, border-color .15s, color .15s}
.btn-primary{background:var(--accent); color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover); color:var(--accent-ink)}
.btn-secondary{background:var(--surface); border-color:var(--line-2); color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink-2); color:var(--ink)}
.btn-ghost{background:transparent; color:var(--muted)}
.btn-ghost:hover{color:var(--ink)}
.btn-danger{background:transparent; border-color:var(--bad); color:var(--bad)}
.btn-sm{min-height:34px; padding:6px 12px; font-size:13.5px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{background:none; border:0; padding:4px 0; color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none}
.link:hover{color:var(--accent-hover); text-decoration:underline}

/* ---------- hero ---------- */
.hero{padding-block:72px 0; border-bottom:1px solid var(--line)}
@media (max-width:720px){ .hero{padding-block:44px 0} }
.hero-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,400px); gap:64px; align-items:start}
@media (max-width:980px){ .hero-grid{grid-template-columns:minmax(0,1fr); gap:40px} }
.kicker{font-size:14px; color:var(--muted)}
.kicker b{color:var(--ink-2); font-weight:600}
.hero-title{font-family:var(--serif); font-weight:600; font-size:clamp(46px,6.4vw,74px); line-height:1; letter-spacing:-.025em; margin-top:16px}
.hero-sub{font-family:var(--serif); font-weight:400; font-size:clamp(21px,2.5vw,27px); line-height:1.3; color:var(--ink-2); margin-top:12px; max-width:28ch}
.hero-abstract{margin-top:24px; max-width:62ch; color:var(--ink-2); font-size:17px; line-height:1.65}
.actions{display:flex; gap:12px; flex-wrap:wrap; margin-top:30px}
.figures-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 16px; flex-wrap:wrap; margin-top:64px; padding-bottom:12px; border-bottom:1px solid var(--line)}
.figures{display:grid; grid-template-columns:repeat(4,minmax(0,1fr))}
.figures > div{padding:20px 20px 28px; border-left:1px solid var(--line); min-width:0}
.figures > div:first-child{padding-left:0; border-left:0}
.figures dt{font-size:13px; color:var(--muted); line-height:1.4}
.figures dd{font-family:var(--serif); font-size:clamp(28px,3.2vw,36px); font-weight:600; line-height:1.1; margin-top:6px; letter-spacing:-.01em}
.figures dd small{display:block; font-family:var(--sans); font-size:13px; font-weight:400; color:var(--muted); letter-spacing:0; margin-top:4px}
@media (max-width:720px){
  .figures-head{margin-top:44px}
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figures > div:nth-child(3){padding-left:0; border-left:0}
  .figures > div:nth-child(n+3){border-top:1px solid var(--line)}
}

/* ---------- panels (hero card, analysis) ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius)}
.next{padding:24px; display:grid; gap:18px}
@media (max-width:980px){ .next{max-width:560px} }
@media (max-width:640px){ .next{padding:20px} }
.panel-head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; flex-wrap:wrap}

/* ---------- teams & scores ---------- */
.side-mark{display:inline-block; width:3px; height:16px; border-radius:2px; background:var(--home); flex-shrink:0}
.side-mark.away{background:var(--away)}
.team{display:inline-flex; align-items:center; gap:10px; min-width:0}
.team-name{font-weight:600; color:var(--ink); overflow-wrap:break-word; min-width:0}
.scoreboard{display:grid; border-top:1px solid var(--line)}
.scoreboard-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
.scoreboard-row .v{font-family:var(--serif); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums}
.scoreboard-head{display:flex; justify-content:space-between; padding-bottom:6px}

/* ---------- prediction call & probabilities ---------- */
.call{display:flex; justify-content:space-between; align-items:flex-end; gap:16px}
.call .stack{display:grid; gap:4px}
.call .right{text-align:right}
.outcome{display:inline-flex; align-items:center; gap:8px; font-size:19px; font-weight:650; color:var(--ink); line-height:1.2}
.outcome::before{content:""; width:10px; height:10px; border-radius:2px; background:var(--draw); flex-shrink:0}
.o-H::before{background:var(--home)} .o-A::before{background:var(--away)}
.conf{font-family:var(--serif); font-size:32px; font-weight:600; line-height:1; letter-spacing:-.01em; font-variant-numeric:tabular-nums}
.prob-bar{display:flex; height:8px; gap:2px; border-radius:2px; overflow:hidden}
.prob-bar span{display:block; height:100%; min-width:2px}
.prob-bar .h{background:var(--home)} .prob-bar .d{background:var(--draw)} .prob-bar .a{background:var(--away)}
.prob-legend{display:flex; justify-content:space-between; gap:8px; margin-top:8px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.prob-legend span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.prob-legend i{width:8px; height:8px; border-radius:2px; display:inline-block}
.prob-legend b{color:var(--ink); font-weight:600}
.k-h{background:var(--home)} .k-d{background:var(--draw)} .k-a{background:var(--away)}
.outcome-sm{display:inline-flex; align-items:center; gap:7px; color:var(--ink-2); white-space:nowrap}
.outcome-sm::before{content:""; width:8px; height:8px; border-radius:2px; background:var(--draw); flex-shrink:0}
.outcome-sm.o-H::before{background:var(--home)} .outcome-sm.o-A::before{background:var(--away)}

/* ---------- section blocks ---------- */
.block{padding-block:96px; border-bottom:1px solid var(--line); scroll-margin-top:var(--header-h)}
@media (max-width:720px){ .block{padding-block:64px} }
.block-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px 40px; flex-wrap:wrap; margin-bottom:40px}
.block-title{max-width:66ch; min-width:0}
.block-title h2{font-family:var(--serif); font-weight:600; font-size:clamp(30px,3.6vw,42px); letter-spacing:-.02em; line-height:1.08}
.h2-tag{font-family:var(--sans); letter-spacing:.06em; vertical-align:middle; position:relative; top:-.2em; margin-left:10px}
.block-title p{margin-top:14px; color:var(--muted); font-size:17px; line-height:1.6}
.block-aside{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.empty{padding:28px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); color:var(--muted)}
.empty strong{display:block; color:var(--ink); font-weight:600; margin-bottom:2px}

/* ---------- prediction cards ---------- */
.pgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px}
@media (max-width:900px){ .pgrid{grid-template-columns:minmax(0,1fr)} }
.pcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px; display:grid; gap:18px; align-content:start}
@media (max-width:640px){ .pcard{padding:18px} }
.pcard-head{display:flex; justify-content:space-between; align-items:center; gap:8px 12px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.flags{display:inline-flex; align-items:center; gap:10px}
.status{font-size:12.5px; font-weight:600; color:var(--muted); white-space:nowrap}
.status-upcoming{color:var(--accent)}
.status-awaiting{color:var(--warn)}
.status-final{color:var(--ink-2)}
.ptable{width:100%; border-collapse:collapse; font-size:14.5px}
.ptable th,.ptable td{padding:9px 0 9px 14px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
.ptable thead th{padding-top:0; padding-bottom:7px; font-size:12px; font-weight:600; color:var(--faint); border-bottom-color:var(--line-2)}
.ptable th:first-child{padding-left:0; text-align:left; white-space:normal; width:100%}
.ptable tbody th{font-weight:600}
.ptable td{color:var(--muted)}
.ptable td.better{color:var(--ink); font-weight:600}
.ptable .score{color:var(--ink); font-weight:700; border-left:1px solid var(--line); padding-left:14px}
.ptable thead .score{color:var(--faint); font-weight:600}
@media (max-width:420px){ .ptable{font-size:13.5px} .ptable th,.ptable td{padding-left:9px} .ptable .score{padding-left:9px} }
.pcard-foot{display:flex; justify-content:space-between; align-items:center; gap:8px 16px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--line)}
.pcard-foot .fine{min-width:0}

/* ---------- owner controls ---------- */
.owner-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px; border-radius:6px; background:var(--accent-soft)}
.owner-row .label{color:var(--accent); margin-right:4px}
.score-in{width:62px; text-align:center}
.form-msg{font-size:13.5px; min-height:1.2em}
.form-msg.err{color:var(--bad)} .form-msg.ok{color:var(--good)}

/* ---------- track record ---------- */
.tr-grid{display:grid; grid-template-columns:minmax(0,4fr) minmax(0,7fr); gap:56px; align-items:start}
@media (max-width:980px){ .tr-grid{grid-template-columns:minmax(0,1fr); gap:40px} }
.big{font-family:var(--serif); font-size:clamp(64px,8vw,92px); font-weight:600; line-height:.95; letter-spacing:-.03em; margin-top:8px; font-variant-numeric:tabular-nums}
.big-cap{margin-top:12px; color:var(--ink-2)}
.statlist{margin-top:28px; border-top:1px solid var(--line)}
.statlist > div{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:12px 0; border-bottom:1px solid var(--line)}
.statlist dt{color:var(--ink-2); font-size:15px}
.statlist dd{text-align:right; font-weight:650; font-size:15px; color:var(--ink)}
.statlist dd span{display:block; font-weight:400; font-size:12.5px; color:var(--muted)}
.figure-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.figure-head h3{font-family:var(--serif); font-size:21px; font-weight:600}
.chart-wrap{position:relative}
.chart-wrap svg{display:block; width:100%; height:auto; overflow:visible}
figure{margin:0}
figcaption{margin-top:12px; font-size:13px; color:var(--muted); line-height:1.5}
.chart-legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px; font-size:13px; color:var(--muted)}
.chart-legend span{display:inline-flex; align-items:center; gap:8px}
.lg-model{display:inline-block; width:18px; height:2px; background:var(--accent)}
.lg-base{display:inline-block; width:18px; border-top:2px dashed var(--faint)}
.c-grid{stroke:var(--line); stroke-width:1}
.c-axis{stroke:var(--line-2); stroke-width:1}
.c-tick{fill:var(--muted); font-family:var(--sans); font-size:12px}
.c-model{fill:none; stroke:var(--accent); stroke-width:2.25; stroke-linejoin:round; stroke-linecap:round}
.c-base{fill:none; stroke:var(--faint); stroke-width:1.5; stroke-dasharray:5 4}
.c-dot{fill:var(--surface); stroke:var(--accent); stroke-width:2}
.c-dot.last{fill:var(--accent)}
.c-lbl{font-family:var(--sans); font-size:12.5px; font-weight:600}
.c-lbl.model{fill:var(--accent)} .c-lbl.base{fill:var(--muted); font-weight:500}
.c-hit{fill:transparent}
.c-hit.on{fill:var(--shade)}
.tooltip{position:absolute; z-index:5; pointer-events:none; min-width:180px; padding:10px 12px; border-radius:6px; background:var(--surface); border:1px solid var(--line-2); box-shadow:0 10px 24px -12px rgba(0,0,0,.35); font-size:13px; line-height:1.5; color:var(--ink-2)}
.tooltip b{color:var(--ink)}
.tr-tables{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:48px; margin-top:64px}
@media (max-width:860px){ .tr-tables{grid-template-columns:minmax(0,1fr); gap:40px} }
.dtable{width:100%; border-collapse:collapse; font-size:14.5px}
.dtable caption{caption-side:top; text-align:left; font-family:var(--serif); font-size:19px; font-weight:600; color:var(--ink); padding-bottom:12px}
.dtable th{font-size:12px; font-weight:600; color:var(--muted); text-align:right; padding:0 0 8px 14px; border-bottom:1px solid var(--line-2); white-space:nowrap}
.dtable td{padding:11px 0 11px 14px; text-align:right; border-bottom:1px solid var(--line); color:var(--ink-2)}
.dtable th:first-child,.dtable td:first-child{text-align:left; padding-left:0}
.dtable tfoot td{border-bottom:0; color:var(--ink); font-weight:650}
.dtable .em{color:var(--ink); font-weight:650}
.table-note{margin-top:12px}
.results-block{margin-top:64px}
.rlist{list-style:none; border-top:1px solid var(--line-2)}
.rhead,.rrow{display:grid; grid-template-columns:56px minmax(0,1fr) 120px 76px 104px 72px; align-items:center; gap:4px 14px}
.rhead{font-size:12px; font-weight:600; color:var(--muted); padding:0 0 8px}
.rrow{padding:12px 0; border-bottom:1px solid var(--line); font-size:14.5px}
.rrow .gw{color:var(--muted); font-variant-numeric:tabular-nums}
.rrow .match{color:var(--ink); min-width:0; overflow-wrap:break-word}
.rrow .score{font-weight:700; padding:0 6px; white-space:nowrap; font-variant-numeric:tabular-nums}
.rrow .num,.rhead .num{text-align:right; font-variant-numeric:tabular-nums}
.verdict{font-weight:600; white-space:nowrap}
.verdict::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:1px; background:currentColor}
.verdict-ok{color:var(--good)} .verdict-miss{color:var(--bad)} .verdict-void{color:var(--muted)}
.rrow .go,.rhead .go{text-align:right}
.rowner{grid-column:2 / -1; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.meta-m{display:none}
@media (max-width:760px){
  .rhead{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) auto; gap:4px 16px}
  .rrow .gw,.rrow .pred,.rrow .cf{display:none}
  .rrow .match{grid-column:1; grid-row:1}
  .rrow .meta-m{display:block; grid-column:1; grid-row:2; font-size:13px; color:var(--muted)}
  .rrow .res{grid-column:2; grid-row:1; text-align:right}
  .rrow .go{grid-column:2; grid-row:2}
  .rowner{grid-column:1 / -1}
}
.more{margin-top:16px}

/* ---------- match analysis ---------- */
.picker{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px}
.picker label{font-weight:600; font-size:14px; color:var(--ink-2)}
.picker select{flex:1 1 280px; max-width:520px}
.an{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media (max-width:980px){ .an{grid-template-columns:minmax(0,1fr)} }
.an-main{padding:32px; border-right:1px solid var(--line); display:grid; grid-template-columns:minmax(0,1fr); gap:24px; align-content:start}
.an-side{padding:32px; display:grid; grid-template-columns:minmax(0,1fr); gap:40px; align-content:start}
@media (max-width:980px){ .an-main{border-right:0; border-bottom:1px solid var(--line)} }
@media (max-width:640px){ .an-main,.an-side{padding:20px} }
.an-meta{display:flex; justify-content:space-between; gap:8px 12px; flex-wrap:wrap; font-size:13px; color:var(--muted)}
.an-title{font-family:var(--serif); font-size:clamp(25px,3vw,32px); font-weight:600; letter-spacing:-.015em; line-height:1.15}
.an-title .v{color:var(--faint); font-weight:400}
.an-scores{display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:16px; padding-block:16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.an-scores .s{display:grid; gap:2px; min-width:0}
.an-scores .s:last-child{text-align:right}
.an-scores .s .v{font-family:var(--serif); font-size:clamp(34px,4.2vw,44px); font-weight:600; line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.an-scores .gap{text-align:center; font-size:13px; color:var(--muted); padding-bottom:4px; font-variant-numeric:tabular-nums}
.an-scores .s .label{overflow-wrap:break-word}
.result-line{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:12px 14px; border-radius:6px; background:var(--surface-2); font-size:14.5px}
.explain h4{font-family:var(--serif); font-size:19px; font-weight:600; margin-bottom:10px}
.explain p{color:var(--ink-2); font-size:15.5px; line-height:1.7}
.explain p+p{margin-top:10px}
.an-side h4{font-family:var(--serif); font-size:19px; font-weight:600}
.an-side .head{display:flex; justify-content:space-between; align-items:baseline; gap:6px 12px; flex-wrap:wrap; margin-bottom:16px}
.compare{display:grid; gap:18px}
.cmp-key{display:flex; justify-content:space-between; gap:12px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.cmp-key span{display:inline-flex; align-items:center; gap:7px; min-width:0}
.cmp-row{display:grid; gap:8px}
.cmp-label{display:flex; justify-content:space-between; gap:8px; font-size:14px; color:var(--ink-2)}
.cmp-label .fine{font-size:12.5px; text-align:right}
.cmp-bars{display:grid; grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 48px; align-items:center; gap:8px}
.cmp-val{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.cmp-val.better{color:var(--ink); font-weight:650}
.cmp-val:last-child{text-align:right}
.cmp-track{height:8px; background:var(--surface-2); border-radius:2px; overflow:hidden; display:flex}
.cmp-track.left{justify-content:flex-end}
.cmp-fill{height:100%}
.cmp-fill.h{background:var(--home)} .cmp-fill.a{background:var(--away)}
.cmp-fill.dim{opacity:.4}
.edge-h{color:var(--home)} .edge-a{color:var(--away)} .edge-n{color:var(--faint)}
.dtable td.edge-h,.dtable td.edge-a{font-weight:600}
.table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ---------- methodology ---------- */
.method-grid{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:64px; align-items:start}
.method-grid + .method-grid{margin-top:72px}
@media (max-width:980px){ .method-grid{grid-template-columns:minmax(0,1fr); gap:48px} }
.proc{list-style:none; counter-reset:step; border-top:1px solid var(--line)}
.proc li{counter-increment:step; display:grid; grid-template-columns:32px minmax(0,1fr); gap:12px; padding:16px 0; border-bottom:1px solid var(--line)}
.proc li::before{content:counter(step) "."; font-family:var(--serif); font-size:18px; font-weight:600; color:var(--accent); line-height:1.4}
.proc h4{font-size:15.5px; font-weight:650}
.proc p{margin-top:3px; color:var(--muted); font-size:14.5px}
.ftable td:first-child{padding-right:16px; width:42%}
.ftable th.rule,.ftable td.rule{text-align:left; padding-left:16px}
.ftable .fname{display:block; color:var(--ink); font-weight:600}
.ftable .fdesc{display:block; font-size:13px; color:var(--muted); margin-top:2px; line-height:1.45}
.ftable code{font-family:var(--mono); font-size:12.5px; color:var(--ink-2)}
.wcell{display:inline-flex; align-items:center; gap:10px; justify-content:flex-end; white-space:nowrap}
.wbar{display:inline-block; width:72px; height:6px; border-radius:2px; background:var(--surface-2); overflow:hidden}
.wbar i{display:block; height:100%; background:var(--accent)}
@media (max-width:640px){
  .ftable thead{display:none}
  .ftable tbody tr,.ftable tfoot tr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; padding:14px 0; border-bottom:1px solid var(--line)}
  .ftable td{display:block; padding:0; border:0; text-align:left}
  .ftable td:first-child{width:auto; grid-column:1; grid-row:1}
  .ftable td:last-child{grid-column:2; grid-row:1; text-align:right}
  .ftable td.rule{grid-column:1 / -1; grid-row:2; padding-left:0}
  .ftable tfoot tr{border-bottom:0}
  .wbar{width:48px}
}
.formula{margin:16px 0 0; font-family:var(--mono); font-size:13px; line-height:1.8; color:var(--ink-2); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px 16px; overflow-x:auto; white-space:pre}
.prose{display:grid; gap:12px; color:var(--ink-2); font-size:15.5px; line-height:1.7; max-width:64ch}
.bullets{list-style:none; border-top:1px solid var(--line)}
.bullets li{padding:12px 0 12px 18px; border-bottom:1px solid var(--line); position:relative; color:var(--ink-2); font-size:15px}
.bullets li::before{content:""; position:absolute; left:2px; top:1.35em; width:6px; height:1.5px; background:var(--faint)}

/* ---------- model development ---------- */
.changelog{list-style:none; border-top:1px solid var(--line-2)}
.cl{display:grid; grid-template-columns:200px minmax(0,1fr); gap:40px; padding:32px 0; border-bottom:1px solid var(--line)}
@media (max-width:760px){ .cl{grid-template-columns:minmax(0,1fr); gap:14px; padding:24px 0} }
.cl-meta{display:grid; gap:6px; align-content:start}
.cl-v{font-family:var(--serif); font-size:34px; font-weight:600; line-height:1; letter-spacing:-.02em}
.cl-current{font-size:12.5px; font-weight:700; color:var(--accent)}
.cl-body{display:grid; gap:16px; min-width:0}
.cl-body h3{font-family:var(--serif); font-size:22px; font-weight:600; letter-spacing:-.01em}
.cl-body .bullets{border-top:0}
.cl-body .bullets li{border-bottom:0; padding:3px 0 3px 18px}
.cl-body .bullets li::before{top:.95em}
.params{display:flex; flex-wrap:wrap; gap:4px 20px; font-size:13.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.params b{color:var(--ink); font-weight:600}
.cl-metrics{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 32px; padding-top:16px; border-top:1px solid var(--line)}
@media (max-width:560px){ .cl-metrics{grid-template-columns:minmax(0,1fr)} }
.cl-metrics > div{display:grid; gap:2px}
.cl-metrics b{font-family:var(--serif); font-size:22px; font-weight:600}
.up{color:var(--good)} .down{color:var(--bad)}

/* ---------- data & transparency ---------- */
.vtable td{text-align:left; vertical-align:top; line-height:1.55}
.vtable th{text-align:left}
.vtable td:first-child{width:24%; color:var(--ink); font-weight:600}
.vtable td:last-child{width:28%}
@media (max-width:760px){
  .vtable thead{display:none}
  .vtable tr{display:grid; gap:4px; padding:14px 0; border-bottom:1px solid var(--line)}
  .vtable td{display:block; width:auto!important; padding:0; border:0}
  .vtable td:last-child{font-size:13.5px; color:var(--muted)}
}
.data-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:64px; margin-top:72px}
@media (max-width:900px){ .data-grid{grid-template-columns:minmax(0,1fr); gap:48px} }
.sources{list-style:none; border-top:1px solid var(--line)}
.sources li{display:flex; justify-content:space-between; align-items:baseline; gap:4px 20px; padding:14px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.sources b{display:block; font-weight:650}
.sources span{font-size:14px; color:var(--muted)}
.sources a{font-size:14px; white-space:nowrap}
.rules{list-style:none; border-top:1px solid var(--line)}
.rules li{padding:14px 0; border-bottom:1px solid var(--line)}
.rules b{display:block; font-weight:650; color:var(--ink)}
.rules p{color:var(--muted); font-size:14.5px; margin-top:2px}
.export-block{margin-top:72px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:64px; align-items:start}
@media (max-width:900px){ .export-block{grid-template-columns:minmax(0,1fr); gap:24px} }
.export{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px}
.export-area{margin-top:14px; width:100%; min-height:140px; font-family:var(--mono); font-size:12px}
details.format{border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
details.format summary{cursor:pointer; padding:14px 0; font-weight:600; color:var(--ink-2)}
details.format pre{margin:0 0 16px; max-height:340px; overflow:auto}
.disclaimer{margin-top:48px; font-size:13.5px; color:var(--muted); max-width:80ch}

/* ---------- about ---------- */
.about-grid{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:64px; align-items:start}
@media (max-width:980px){ .about-grid{grid-template-columns:minmax(0,1fr); gap:48px} }
.question{font-family:var(--serif); font-size:clamp(23px,2.8vw,30px); font-weight:500; line-height:1.3; letter-spacing:-.01em; color:var(--ink); max-width:34ch; padding-top:16px; border-top:1px solid var(--line)}
.about-text{margin-top:20px}
.scope{border-top:1px solid var(--line)}
.scope > div{padding:14px 0; border-bottom:1px solid var(--line)}
.scope dt{font-weight:650}
.scope dd{color:var(--muted); font-size:14.5px; margin-top:2px}
.analyst{margin-top:40px; padding-top:20px; border-top:1px solid var(--line); display:grid; gap:6px; justify-items:start}
.analyst-name{font-family:var(--serif); font-size:22px; font-weight:600}

/* ---------- footer ---------- */
.site-footer{padding-block:48px 40px}
.footer-row{display:flex; justify-content:space-between; align-items:flex-start; gap:24px 40px; flex-wrap:wrap}
.footer-brand{display:grid; gap:6px}
.footer-brand .tagline{font-size:14px; color:var(--muted)}
.footer-links{display:flex; gap:10px 24px; flex-wrap:wrap; align-items:center}
.footer-links a{font-size:14.5px; color:var(--ink-2); text-decoration:none}
.footer-links a:hover{color:var(--accent); text-decoration:underline}
.footer-fine{margin-top:32px; padding-top:20px; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:8px 24px; flex-wrap:wrap; font-size:13px; color:var(--muted)}

/* ---------- forms ---------- */
.form-card{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--radius); padding:28px; display:grid; gap:22px; margin-bottom:28px; scroll-margin-top:calc(var(--header-h) + 16px)}
@media (max-width:640px){ .form-card{padding:20px} }
.form-head{display:grid; gap:6px}
.form-head h3{font-family:var(--serif); font-size:24px; font-weight:600}
.form-head p{color:var(--muted); font-size:14.5px; max-width:72ch}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:14px 16px}
.form-teams{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
@media (max-width:760px){ .form-teams{grid-template-columns:minmax(0,1fr)} }
fieldset{margin:0; padding:16px; border:1px solid var(--line); border-radius:6px; display:grid; gap:12px; min-width:0}
legend{padding:0 6px; font-weight:700; font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2)}
legend .side-mark{vertical-align:-3px; margin-right:8px}
.field{display:grid; gap:6px; min-width:0; align-content:start}
.field label{font-size:13.5px; font-weight:600; color:var(--ink-2)}
.field .hint{font-size:12.5px; color:var(--muted)}
.field-row{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
input,select,textarea{font:inherit; font-size:15px; color:var(--ink); background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:9px 11px; width:100%; min-width:0; min-height:42px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:96px; resize:vertical; line-height:1.5}
select{appearance:none; -webkit-appearance:none; padding-right:36px; cursor:pointer; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size:5px 5px; background-repeat:no-repeat}
.form-actions{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.preview{padding:18px; border-radius:6px; background:var(--bg); border:1px solid var(--line); display:grid; gap:14px}
.weights-total{font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums}
.weights-total.bad{color:var(--bad)} .weights-total.good{color:var(--good)}

/* ---------- play: Title Race ---------- */
.tag-game{display:inline-flex; align-items:center; height:22px; padding:0 7px; border-radius:4px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.hero-play{align-self:center; margin-left:4px}
@media (max-width:520px){ .hero-play{margin-left:0} }
.g-top{display:flex; justify-content:space-between; align-items:center; gap:12px 24px; flex-wrap:wrap; margin-bottom:24px}
.g-top .fine{max-width:62ch}
.seg{display:inline-flex; gap:2px; padding:3px; border:1px solid var(--line-2); border-radius:8px; background:var(--surface)}
.seg-btn{border:0; background:transparent; min-height:36px; padding:6px 14px; border-radius:5px; font-size:14px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:var(--accent-soft); color:var(--accent)}
.g-how{list-style:none; counter-reset:how; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 32px; padding:18px 0; margin-bottom:24px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.g-how li{counter-increment:how; display:grid; grid-template-columns:24px minmax(0,1fr); column-gap:12px; font-size:14px; color:var(--muted); line-height:1.5}
.g-how li::before{content:counter(how); grid-row:1 / span 2; width:24px; height:24px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12.5px; line-height:24px; text-align:center}
.g-how b{color:var(--ink); font-weight:650}
@media (max-width:860px){ .g-how{grid-template-columns:minmax(0,1fr)} }
.g-board{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:24px; align-items:start}
@media (max-width:900px){ .g-board{grid-template-columns:minmax(0,1fr)} }
.g-rival{padding:24px 26px; display:grid; gap:18px}
.g-rival-head{display:flex; align-items:center; gap:16px; min-width:0}
.g-rival-head > div{min-width:0}
.g-rival-head h3{font-family:var(--serif); font-size:clamp(24px,2.6vw,30px); font-weight:600; letter-spacing:-.015em; margin-top:2px; overflow-wrap:break-word}
.g-crest{flex-shrink:0; width:52px; height:52px; border-radius:10px; display:grid; place-items:center; background:var(--surface-2); border:1px solid var(--line-2); font-family:var(--serif); font-weight:600; font-size:18px; letter-spacing:.02em; color:var(--ink-2)}
.g-stats{list-style:none; border-top:1px solid var(--line-2)}
.g-stat{display:grid; grid-template-columns:minmax(0,1.3fr) 92px minmax(0,1fr) 92px; grid-template-areas:"name val worth act"; align-items:center; gap:8px 18px; padding:13px 0; border-bottom:1px solid var(--line)}
.g-stat-name{grid-area:name; display:grid; min-width:0}
.g-stat-name b{font-weight:650; font-size:15.5px}
.g-stat-val{grid-area:val; display:grid; gap:3px; white-space:nowrap}
.g-stat-val .fine{font-size:12.5px; line-height:1.2}
.g-num{font-family:var(--serif); font-size:28px; font-weight:600; line-height:1; letter-spacing:-.01em}
.g-stat-worth{grid-area:worth; display:grid; gap:6px; min-width:0}
.g-stat-worth b{color:var(--ink); font-weight:650}
.g-meter{display:block; height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden}
.g-meter i{display:block; height:100%; background:var(--accent); border-radius:3px}
.g-stat-act{grid-area:act; text-align:right}
.g-take{min-width:84px}
.g-filled{font-size:13px; color:var(--faint); font-weight:600; white-space:nowrap}
.g-stat.is-filled .g-stat-name,.g-stat.is-filled .g-stat-val,.g-stat.is-filled .g-stat-worth{opacity:.4}
@media (max-width:560px){
  .g-rival{padding:18px}
  .g-stat{grid-template-columns:minmax(0,1fr) 124px; grid-template-areas:"name act" "val worth"; gap:10px 16px}
  .g-stat-act .g-take{width:100%}
  .g-crest{width:44px; height:44px; font-size:16px}
}
.g-lifelines{display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap}
.g-life{border:1px dashed var(--line-2); color:var(--ink-2)}
.g-life:hover{border-color:var(--ink-2); color:var(--ink)}
.g-lifelines .fine{margin-left:2px}
.g-scout{display:grid; gap:2px; padding:12px 14px; border-radius:6px; background:var(--surface-2); font-size:14.5px}
.g-scout-nums{color:var(--ink-2); font-variant-numeric:tabular-nums}
.g-club{padding:22px 24px; display:grid; gap:16px; align-content:start}
@media (max-width:560px){ .g-club{padding:18px} }
.g-club-head{display:grid; gap:4px}
.g-name-wrap{position:relative; margin-left:-9px}
.g-name{font-family:var(--serif); font-size:24px; font-weight:600; letter-spacing:-.01em; border:1px solid transparent; background:transparent; padding:2px 36px 2px 8px; min-height:40px; border-radius:6px}
.g-name:hover{border-color:var(--line-2)}
.g-pencil{position:absolute; right:10px; top:50%; width:15px; height:15px; margin-top:-7.5px; color:var(--faint); pointer-events:none}
.g-slots{list-style:none; border-top:1px solid var(--line-2)}
.g-slot{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:baseline}
.g-slot-name{font-weight:600; font-size:14.5px}

/* Every club the draft could have produced, given one pass: any four of the first

function allDrafts(league, version) {

    if (arr.length <= 1) return [arr];
    var res = [];
    arr.forEach(function (x, i) { perms(arr.slice(0, i).concat(arr.slice(i + 1))).forEach(function (p) { res.push([x].concat(p)); }); });

    perms(used).forEach(function (p) {

  if (pos <= 7) return { key: "europe", label: "European places" };
  if (pos <= 10) return { key: "tophalf", label: "Top half" };

/* Everything the results screen needs, rebuilt from the seed and the picks alone. */
function gameOutcome(league, picks, version, name) {
  var club = clubFromPicks(league, picks, name), sm = seasonModel(league, club, version), sig = picksSignature(picks);

  var sims = simulateSeasons(sm, GAME_SIMS, makeRng("sims|" + league.seed + "|" + sig));

  var best = drafts[0], bestClub = clubFromPicks(league, best.picks);
  var bestSm = seasonModel(league, bestClub, version);

    club: club, sm: sm, season: season, sims: sims, score: score,
    xpts: expectedPoints(sm, 0), bestXpts: expectedPoints(bestSm, 0),

}

function Raw(s) { this.s = s; }

  if (m.result && m.result.status === "postponed") return "postponed";
  if (m.result) return "final";

}
const isFinal = m => statusOf(m) === "final";
const isCorrect = m => isFinal(m) && resultOutcome(m.result) === predictionOf(m).outcome;

function summarize(ms) {
  const counted = ms.filter(m => statusOf(m) !== "postponed");
  const finals = ms.filter(isFinal);
  const by = { H: { n: 0, c: 0 }, D: { n: 0, c: 0 }, A: { n: 0, c: 0 } };
  let correct = 0, homeWins = 0;
  finals.forEach(m => {
    const o = predictionOf(m).outcome, ok = isCorrect(m);
    by[o].n++;
    if (ok) { by[o].c++; correct++; }
    if (resultOutcome(m.result) === "H") homeWins++;
  });
  return {
    total: counted.length, open: counted.length - finals.length, graded: finals.length, correct: correct,
    accuracy: finals.length ? correct / finals.length : null,
    baseline: finals.length ? homeWins / finals.length : null, by: by

}
function timelineSeries(ms) {
  const finals = ms.filter(isFinal);
  const gws = Array.from(new Set(finals.map(m => Number(m.gameweek)))).sort((a, b) => a - b);
  let cc = 0, cn = 0, chw = 0;
  return gws.map(gw => {
    const g = finals.filter(m => Number(m.gameweek) === gw);
    const c = g.filter(isCorrect).length, hw = g.filter(m => resultOutcome(m.result) === "H").length;
    cc += c; cn += g.length; chw += hw;
    return { gw: gw, n: g.length, c: c, acc: c / g.length, cum: cc / cn, base: chw / cn, cc: cc, cn: cn };

}

/* ===== Formatting ===== */
const fmtPct = p => Math.round(p * 100) + "%";
const fmt1 = v => Number(v).toFixed(1);

const capital = s => s.charAt(0).toUpperCase() + s.slice(1);

function fmtKickoff(iso) {

}
function fmtDay(s) {

}
function fmtLead(ms) {

  if (!words.length) return "?";
  if (words.length === 1) return words[0].slice(0, 3).toUpperCase();

}

/* ===== Explanation ===== */
function factorSentence(key, W, L) {
  switch (key) {
    case "form": return `${W.name} took ${W.form} points from their last five matches, compared with ${L.form} for ${L.name}.`;
    case "scored": return `${W.name} scored ${fmt1(W.scored)} goals per game, against ${fmt1(L.scored)} for ${L.name}.`;
    case "defense": return `${W.name} conceded ${fmt1(W.allowed)} goals per game, while ${L.name} conceded ${fmt1(L.allowed)}.`;
    default: return `${W.name} created ${W.xg.toFixed(2)} xG per game, compared with ${L.xg.toFixed(2)} for ${L.name}.`;
  }
}
function valuePair(key, A, B) {
  switch (key) {
    case "form": return `${A.form} vs ${B.form} points`;
    case "scored": return `${fmt1(A.scored)} vs ${fmt1(B.scored)} goals per game`;
    case "defense": return `${fmt1(A.allowed)} vs ${fmt1(B.allowed)} goals conceded per game`;
    default: return `${A.xg.toFixed(2)} vs ${B.xg.toFixed(2)} xG per game`;
  }
}
function explain(m) {
  const v = versionById(m.modelVersion), p = predictionOf(m);
  const ch = contributions(factorRatings(m.home, true, v), v.weights);
  const ca = contributions(factorRatings(m.away, false, v), v.weights);
  const diffs = FACTORS.filter(f => f.key !== "home").map(f => ({ key: f.key, d: ch[f.key] - ca[f.key] }));
  const homeAdv = v.weights.home || 0, abs1 = x => Math.abs(x).toFixed(1), out = [];
  if (p.outcome === "D") {
    out.push(`The model scores are ${p.scores.home.toFixed(1)} for ${m.home.name} and ${p.scores.away.toFixed(1)} for ${m.away.name}, a gap of ${abs1(p.gap)} points. That is inside the ±${v.drawZone}-point draw zone, so the model predicts a draw.`);
    const awayEdges = diffs.filter(x => x.d < -0.25).sort((a, b) => a.d - b.d).slice(0, 2);
    if (homeAdv > 0 && awayEdges.length) {
      out.push(`Playing at home is worth ${homeAdv} points to ${m.home.name}. ${possessive(m.away.name)} better ${joinAnd(awayEdges.map(x => FACTOR_NOUN[x.key]))} ${awayEdges.length > 1 ? "cancel" : "cancels"} out most of that advantage.`);
    } else {
      out.push("The two teams are closely matched across the five factors.");
    }
    return out;
  }
  const fav = p.outcome === "H" ? 1 : -1;
  const W = fav > 0 ? m.home : m.away, L = fav > 0 ? m.away : m.home;
  const sw = fav > 0 ? p.scores.home : p.scores.away, sl = fav > 0 ? p.scores.away : p.scores.home;
  out.push(`The model favors ${W.name} by ${abs1(p.gap)} points (${sw.toFixed(1)} to ${sl.toFixed(1)}).`);
  const pro = diffs.filter(x => x.d * fav > 0.25).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  const con = diffs.filter(x => x.d * fav < -0.25).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  let s = "";
  if (pro.length) {
    s = `${capital(FACTOR_NAME[pro[0].key])} is the biggest factor, worth ${abs1(pro[0].d)} points. ${factorSentence(pro[0].key, W, L)}`;
    if (pro[1]) s += ` ${capital(FACTOR_NAME[pro[1].key])} adds another ${abs1(pro[1].d)} (${valuePair(pro[1].key, W, L)}).`;
    if (fav > 0 && homeAdv) s += ` Home advantage adds ${homeAdv} more.`;
    if (fav < 0 && homeAdv) s += ` That is enough to overcome the ${homeAdv}-point home advantage of ${m.home.name}.`;
  } else if (fav > 0 && homeAdv) {
    s = `Home advantage decides it. Playing at home is worth ${homeAdv} points to ${m.home.name}.`;
  }
  if (s) out.push(s);
  if (con.length) out.push(`${L.name} had the better ${FACTOR_NOUN[con[0].key]} (${valuePair(con[0].key, L, W)}), which narrows the gap by ${abs1(con[0].d)} points.`);
  return out;
}

/* ===== Track record ===== */
const BANDS = [[0, 0.4, "Below 40%"], [0.4, 0.5, "40% to 50%"], [0.5, 0.6, "50% to 60%"], [0.6, 1.01, "60% or more"]];
function trackStats(ms) {
  const s = summarize(ms), fin = ms.filter(isFinal);
  const conf = m => predictionOf(m).confidence;
  s.avgConf = fin.length ? fin.reduce((t, m) => t + conf(m), 0) / fin.length : null;
  s.brier = fin.length ? fin.reduce((t, m) => {
    const p = predictionOf(m).probs, o = resultOutcome(m.result);
    return t + Math.pow(p.home - (o === "H" ? 1 : 0), 2) + Math.pow(p.draw - (o === "D" ? 1 : 0), 2) + Math.pow(p.away - (o === "A" ? 1 : 0), 2);
  }, 0) / fin.length : null;
  s.bands = BANDS.map(([lo, hi, label]) => {
    const g = fin.filter(m => conf(m) >= lo && conf(m) < hi);
    return { label: label, n: g.length, c: g.filter(isCorrect).length, avg: g.length ? g.reduce((t, m) => t + conf(m), 0) / g.length : null };
  });
  return s;
}
function TrackRecordSection() {
  const ms = shownMatches(), t = trackStats(ms);
  const pctOf = (c, n) => (n ? fmtPct(c / n) : "—");
  const outcomeRows = ["H", "D", "A"].map(o => html`<tr><td><span class="outcome-sm o-${o}">${OUTCOME_LABEL[o]}</span></td><td>${t.by[o].n}</td><td>${t.by[o].c}</td><td class="em">${pctOf(t.by[o].c, t.by[o].n)}</td></tr>`);
  return html`<section class="block" id="performance"><div class="wrap">
    ${BlockHead({
      title: "Track record", sample: true,
      lede: "How the published predictions have performed. A prediction counts as correct when the predicted outcome happens; postponed matches are left out of every figure."
    })}
    <div class="tr-grid">
      <div>
        <span class="label">Overall accuracy</span>
        <p class="big">${t.graded ? fmtPct(t.accuracy) : "—"}</p>
        <p class="big-cap">${t.graded ? `${t.correct} of ${t.graded} graded predictions were correct.` : "Accuracy appears after the first graded match."}</p>
        <dl class="statlist">
          <div><dt>Predictions published</dt><dd>${t.total}<span>${t.open} awaiting a result</span></dd></div>
          ${t.graded ? html`
          <div><dt>Always picking the home team</dt><dd>${fmtPct(t.baseline)}<span>Model ${signedPts(t.accuracy - t.baseline)}</span></dd></div>
          <div><dt>Brier score</dt><dd>${t.brier.toFixed(3)}<span>Lower is better; guessing ⅓ each scores 0.667</span></dd></div>
          <div><dt>Average confidence</dt><dd>${fmtPct(t.avgConf)}<span>On graded predictions</span></dd></div>` : ""}
        </dl>
      </div>
      <figure>
        <div class="figure-head"><h3>Cumulative accuracy by gameweek</h3><span class="fine">n = ${t.graded} graded</span></div>
        <div class="chart-wrap" id="acc-chart"></div>
        <figcaption>Share of graded predictions that were correct after each gameweek, compared with always predicting a home win. Hover or tap a gameweek for details.</figcaption>
      </figure>
    </div>
    ${t.graded ? html`<div class="tr-tables">
      <div>
        <table class="dtable"><caption>Accuracy by predicted outcome</caption>
          <thead><tr><th scope="col">Prediction</th><th scope="col">Made</th><th scope="col">Correct</th><th scope="col">Accuracy</th></tr></thead>
          <tbody>${outcomeRows}</tbody>
          <tfoot><tr><td>All predictions</td><td>${t.graded}</td><td>${t.correct}</td><td>${fmtPct(t.accuracy)}</td></tr></tfoot>
        </table>
      </div>
      <div>
        <table class="dtable"><caption>Calibration</caption>
          <thead><tr><th scope="col">Confidence</th><th scope="col">Predictions</th><th scope="col">Avg. confidence</th><th scope="col">Hit rate</th></tr></thead>
          <tbody>${t.bands.map(b => html`<tr><td>${b.label}</td><td>${b.n}</td><td>${b.n ? fmtPct(b.avg) : "—"}</td><td class="em">${pctOf(b.c, b.n)}</td></tr>`)}</tbody>
        </table>
        <p class="fine table-note">A well-calibrated model is right about as often as its confidence says. With few predictions in a band, the hit rate is noisy.</p>
      </div>
    </div>` : ""}
    <div class="results-block">
      <h3 class="sub-h">Recent results</h3>
      <div id="results-list">${ResultsList(ms)}</div>
    </div>
  </div></section>`;
}
function ResultsList(ms) {

function ResultRow(m) {

  </li>`;

function drawChart() {
  const el = document.getElementById("acc-chart");
  if (!el) return;
  const series = timelineSeries(shownMatches());
  const width = Math.max(280, Math.floor(el.clientWidth));
  ui.chartWidth = width;
  if (!series.length) {
    el.innerHTML = '<div class="empty"><strong>No graded predictions yet.</strong>The chart starts once the first gameweek has results.</div>';
    return;
  }
  const narrow = width < 520;
  const H = narrow ? 230 : 290, M = { t: 14, r: narrow ? 12 : 128, b: 34, l: 44 };
  const w = width - M.l - M.r, h = H - M.t - M.b, n = series.length, last = series[n - 1];
  const x = i => (n === 1 ? M.l + w / 2 : M.l + (w * i) / (n - 1));
  const y = v => M.t + (1 - v) * h;
  let s = `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Cumulative accuracy by gameweek. After gameweek ${last.gw}: model ${fmtPct(last.cum)}, always picking home ${fmtPct(last.base)}.">`;
  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    s += `<line class="${t === 0 ? "c-axis" : "c-grid"}" x1="${M.l}" x2="${M.l + w}" y1="${y(t)}" y2="${y(t)}"/>`;
    s += `<text class="c-tick" x="${M.l - 10}" y="${y(t) + 4}" text-anchor="end">${t * 100}%</text>`;
  });
  const step = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(w / 46))));
  series.forEach((d, i) => { if (i % step === 0 || i === n - 1) s += `<text class="c-tick" x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">GW${d.gw}</text>`; });
  const path = k => series.map((d, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(d[k]).toFixed(1)).join(" ");
  if (n > 1) s += `<path class="c-base" d="${path("base")}"/><path class="c-model" d="${path("cum")}"/>`;
  else s += `<line class="c-base" x1="${x(0) - 16}" x2="${x(0) + 16}" y1="${y(last.base)}" y2="${y(last.base)}"/>`;
  series.forEach((d, i) => { s += `<circle class="c-dot${i === n - 1 ? " last" : ""}" cx="${x(i).toFixed(1)}" cy="${y(d.cum).toFixed(1)}" r="${i === n - 1 ? 4.5 : 3.5}"/>`; });
  if (!narrow) {
    let ym = y(last.cum), yb = y(last.base);
    if (Math.abs(ym - yb) < 18) { const mid = (ym + yb) / 2, up = ym <= yb ? -1 : 1; ym = mid + up * 9; yb = mid - up * 9; }
    s += `<text class="c-lbl model" x="${(x(n - 1) + 12).toFixed(1)}" y="${(ym + 4).toFixed(1)}">Model ${fmtPct(last.cum)}</text>`;
    s += `<text class="c-lbl base" x="${(x(n - 1) + 12).toFixed(1)}" y="${(yb + 4).toFixed(1)}">Always home ${fmtPct(last.base)}</text>`;
  }
  const half = n === 1 ? w / 2 : w / (n - 1) / 2;
  series.forEach((d, i) => {
    const x0 = Math.max(M.l, x(i) - half), x1 = Math.min(M.l + w, x(i) + half);
    s += `<rect class="c-hit" data-i="${i}" x="${x0.toFixed(1)}" y="${M.t}" width="${(x1 - x0).toFixed(1)}" height="${h}"/>`;
  });
  s += "</svg>";
  const legend = narrow ? '<div class="chart-legend"><span><i class="lg-model"></i>Model</span><span><i class="lg-base"></i>Always picking home</span></div>' : "";
  el.innerHTML = s + legend + '<div class="tooltip" hidden></div>';
  const tip = el.querySelector(".tooltip");
  el.querySelectorAll(".c-hit").forEach(r => {
    const show = () => {
      const i = +r.dataset.i, d = series[i];
      el.querySelectorAll(".c-hit").forEach(o => o.classList.toggle("on", o === r));
      tip.innerHTML = `<b>Gameweek ${d.gw}</b><br>${d.c} of ${d.n} correct this gameweek<br>Season to date: ${fmtPct(d.cum)} (${d.cc} of ${d.cn})<br>Always home: ${fmtPct(d.base)}`;
      tip.hidden = false;
      const tw = tip.offsetWidth;
      tip.style.left = Math.min(Math.max(0, x(i) - tw / 2), width - tw) + "px";
      tip.style.top = Math.max(0, y(d.cum) - tip.offsetHeight - 14) + "px";
    };
    r.addEventListener("pointerenter", show);
    r.addEventListener("pointerdown", show);
    r.addEventListener("pointerleave", () => { tip.hidden = true; r.classList.remove("on"); });
  });
}

/* ===== Match analysis ===== */
const COMPARE_ROWS = [
  { key: "form", label: "Recent form", unit: "points, last 5", max: 15, fmt: v => String(v) },
  { key: "scored", label: "Goals scored", unit: "per game", max: 3, fmt: v => fmt1(v) },
  { key: "allowed", label: "Goals allowed", unit: "per game, lower is better", max: 3, fmt: v => fmt1(v), low: true },
  { key: "xg", label: "Expected goals (xG)", unit: "per game", max: 3, fmt: v => Number(v).toFixed(2) }
];
function defaultAnalysisId(ms) {
  const up = ms.filter(m => statusOf(m) === "upcoming").sort(byKickoff)[0];
  if (up) return up.id;
  const sorted = ms.slice().sort(byKickoff);
  return sorted[sorted.length - 1].id;
}
function AnalysisSection() {
  const ms = shownMatches().slice().sort(byKickoff);
  const head = BlockHead({
    title: "Match analysis",
    lede: "How the model reached a prediction: the inputs for both teams, how much each factor contributed to the score, and a plain-language summary."
  });

  if (!ms.some(m => m.id === ui.selectedId)) ui.selectedId = defaultAnalysisId(ms);
  const open = ms.filter(m => ["upcoming", "awaiting"].includes(statusOf(m)));
  const done = ms.filter(m => ["final", "postponed"].includes(statusOf(m))).reverse();
  const opt = m => html`<option value="${m.id}"${raw(m.id === ui.selectedId ? " selected" : "")}>GW${m.gameweek} · ${m.home.name} v ${m.away.name}${statusOf(m) === "final" ? ` (${m.result.home}–${m.result.away})` : ""}</option>`;
  return html`<section class="block" id="analysis"><div class="wrap">
    ${head}
    <div class="picker"><label for="match-select">Match</label>
      <select id="match-select">
        ${open.length ? html`<optgroup label="Upcoming">${open.map(opt)}</optgroup>` : ""}

function AnalysisBody(m) {
  const p = predictionOf(m), v = versionById(m.modelVersion), st = statusOf(m);
  return html`<article class="panel an">
    <div class="an-main">
      <div class="an-meta"><span>GW ${m.gameweek} · ${fmtKickoff(m.kickoff)}</span><span class="flags">${Status(m)}${m.sample ? SampleTag() : ""}</span></div>
      <h3 class="an-title">${m.home.name} <span class="v">v</span> ${m.away.name}</h3>
      ${Call(p)}
      ${ProbBar(p.probs)}
      <div class="an-scores">
        <div class="s"><span class="fine">${m.home.name}</span><span class="v">${p.scores.home.toFixed(1)}</span></div>
        <div class="gap">gap<br>${signed(p.gap)}</div>
        <div class="s"><span class="fine">${m.away.name}</span><span class="v">${p.scores.away.toFixed(1)}</span></div>
      </div>

      ${st === "postponed" ? html`<div class="result-line"><span>Match postponed</span><span class="verdict verdict-void">Not counted</span></div>` : ""}
      <div class="explain"><h4>Why the model leans this way</h4>${explain(m).map(t => html`<p>${t}</p>`)}</div>
      <p class="fine">Statistical estimate · ${loggedText(m, true)}</p>
    </div>
    <div class="an-side">
      <section aria-labelledby="cmp-title"><div class="head"><h4 id="cmp-title">Last five matches</h4><span class="fine">Premier League only</span></div>${Compare(m)}</section>
      <section aria-labelledby="ctb-title"><div class="head"><h4 id="ctb-title">Score breakdown</h4><span class="fine">Model points out of 100 · v${v.id}</span></div>${ContribTable(m, v, p)}</section>
    </div>
  </article>`;
}
function Compare(m) {
  return html`<div class="compare">
    <div class="cmp-key"><span>${raw('<i class="side-mark home" aria-hidden="true"></i>')}${m.home.name}</span><span>${m.away.name}${raw('<i class="side-mark away" aria-hidden="true"></i>')}</span></div>
    ${COMPARE_ROWS.map(r => {
      const h = m.home[r.key], a = m.away[r.key];
      const hb = r.low ? h < a : h > a, ab = r.low ? a < h : a > h;
      const hw = Math.min(100, (h / r.max) * 100), aw = Math.min(100, (a / r.max) * 100);
      return html`<div class="cmp-row">
        <div class="cmp-label"><span>${r.label}</span><span class="fine">${r.unit}</span></div>
        <div class="cmp-bars">
          <span class="cmp-val${hb ? " better" : ""}">${r.fmt(h)}</span>
          <span class="cmp-track left"><span class="cmp-fill h${ab ? " dim" : ""}" style="width:${hw.toFixed(1)}%"></span></span>
          <span class="cmp-track"><span class="cmp-fill a${hb ? " dim" : ""}" style="width:${aw.toFixed(1)}%"></span></span>
          <span class="cmp-val${ab ? " better" : ""}">${r.fmt(a)}</span>
        </div>
      </div>`;
    })}
  </div>`;
}
function ContribTable(m, v, p) {
  const ch = contributions(factorRatings(m.home, true, v), v.weights);
  const ca = contributions(factorRatings(m.away, false, v), v.weights);
  const hi = initials(m.home.name), ai = initials(m.away.name);
  const edge = d => (Math.abs(d) < 0.05 ? html`<td class="edge-n">Even</td>` : html`<td class="${d > 0 ? "edge-h" : "edge-a"}">${d > 0 ? hi : ai} +${Math.abs(d).toFixed(1)}</td>`);
  return html`<div class="table-scroll"><table class="dtable">
    <thead><tr><th scope="col">Factor</th><th scope="col">Weight</th><th scope="col"><abbr title="${m.home.name}">${hi}</abbr></th><th scope="col"><abbr title="${m.away.name}">${ai}</abbr></th><th scope="col">Edge</th></tr></thead>
    <tbody>${FACTORS.map(f => html`<tr><td>${f.label}</td><td>${v.weights[f.key]}%</td><td>${ch[f.key].toFixed(1)}</td><td>${ca[f.key].toFixed(1)}</td>${edge(ch[f.key] - ca[f.key])}</tr>`)}</tbody>
    <tfoot><tr><td>Model score</td><td>100%</td><td>${p.scores.home.toFixed(1)}</td><td>${p.scores.away.toFixed(1)}</td>${edge(p.gap)}</tr></tfoot>
  </table></div>
  <p class="fine table-note">Points = rating × weight ÷ 100. Rows may not add up exactly because of rounding.</p>`;
}

/* ===== Methodology ===== */
const FACTOR_INFO = {
  form: { rule: "points ÷ 15 × 100", text: "Points from the last five matches: 3 for a win, 1 for a draw, 0 for a loss." },
  scored: { rule: "goals per game ÷ 3 × 100, max 100", text: "Average goals scored per match." },
  defense: { rule: "(1 − goals allowed ÷ 3) × 100, min 0", text: "Average goals allowed per match. Fewer is better." },

function MethodologySection() {

/* ===== Model development ===== */
function nextVersionId(id) {
  const m = /^(\d+)\.(\d+)$/.exec(id || "");
  return m ? m[1] + "." + (Number(m[2]) + 1) : "";
}
function VersionEntry(v) {
  const isCurrent = v.id === currentVersion().id;
  const ms = shownMatches().filter(m => m.modelVersion === v.id && isFinal(m));
  const c = ms.filter(isCorrect).length, acc = ms.length ? c / ms.length : null;
  const prev = previousVersion(v);
  let compare;
  if (!prev) compare = html`<b>First version</b><span class="fine">Baseline for later versions</span>`;
  else {
    const pf = shownMatches().filter(m => m.modelVersion === prev.id && isFinal(m));
    if (ms.length < MIN_COMPARE || pf.length < MIN_COMPARE) {
      compare = html`<b>Too early to compare</b><span class="fine">Needs ${MIN_COMPARE} graded predictions for both v${prev.id} and v${v.id}. This version has ${ms.length}.</span>`;
    } else {
      const pacc = pf.filter(isCorrect).length / pf.length, d = Math.round((acc - pacc) * 100);
      compare = html`<b class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "Improved by " + d : d < 0 ? "Declined by " + Math.abs(d) : "No change, 0"} pts</b><span class="fine">v${prev.id} was ${fmtPct(pacc)} on ${pf.length} predictions</span>`;
    }
  }
  return html`<li class="cl">
    <div class="cl-meta"><span class="cl-v">v${v.id}</span>${isCurrent ? html`<span class="cl-current">Current version</span>` : ""}<span class="fine">${fmtDay(v.date)}</span></div>
    <div class="cl-body">
      <h3>${v.summary}</h3>
      ${v.changes && v.changes.length ? html`<ul class="bullets">${v.changes.map(t => html`<li>${t}</li>`)}</ul>` : ""}
      <p class="params">${FACTORS.map(f => html`<span>${PARAM_LABEL[f.key]} <b>${v.weights[f.key]}%</b></span>`)}<span>Draw zone <b>±${v.drawZone}</b></span><span>Scale <b>${v.scale}</b></span></p>
      <div class="cl-metrics">
        <div><span class="label">Accuracy${isSampleMode() ? " · sample data" : ""}</span>${ms.length ? html`<b>${fmtPct(acc)}</b><span class="fine">${c} of ${ms.length} graded predictions</span>` : html`<b>—</b><span class="fine">No graded predictions yet</span>`}</div>
        <div><span class="label">Change from previous version</span>${compare}</div>
      </div>
    </div>
  </li>`;
}

function exportRecord(m) {

  const rows = shownMatches().slice().sort(byKickoff).map(m => {

/* ===== Play: Title Race (views and controller) ===== */
const PLAY_KEY = "pitchmetrics-play-v1";
const SLOT_TEXT = {
  form: { name: "Recent form", hint: "Points from the last five matches", unit: "pts", fmt: v => String(v) },
  scored: { name: "Goals scored", hint: "Per game over the last five", unit: "per game", fmt: v => Number(v).toFixed(1) },
  defense: { name: "Goals allowed", hint: "Per game. Fewer is better", unit: "per game", fmt: v => Number(v).toFixed(1) },
  xg: { name: "Expected goals", hint: "Quality of chances created", unit: "xG per game", fmt: v => Number(v).toFixed(1) }
};
const play = { mode: "daily", name: "Your club", games: { daily: null, practice: null }, record: null, revealing: false, revealAt: 0, timer: 0, histWidth: 0 };

/* ----- helpers ----- */
function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function pctWhole(p) { if (p > 0 && p < 0.005) return "under 1%"; if (p < 1 && p > 0.995) return "over 99%"; return Math.round(p * 100) + "%"; }
const SIMS_TEXT = GAME_SIMS.toLocaleString("en-US");
const slotDef = key => GAME_SLOTS.find(f => f.key === key);
const activeGame = () => play.games[play.mode];
const filledCount = g => GAME_SLOTS.filter(f => g.picks[f.key] != null).length;
const isComplete = g => filledCount(g) === GAME_SLOTS.length;
const rivalAt = (g, pos) => g.league.rivals[g.league.order[pos]];
const canPass = g => !g.played && !isComplete(g) && g.passPos == null && g.pos + 1 < g.league.order.length;
function canScout(g) {
  if (g.played || isComplete(g) || g.scoutPos != null || g.pos + 1 >= g.league.order.length) return false;
  return !(g.passPos != null && filledCount(g) === GAME_SLOTS.length - 1);
}
function outcomeOf(g) {

/* ----- saving (this browser only) ----- */
function blankRecord() { return { played: 0, titles: 0, invincibles: 0, top4: 0, perfect: 0, bestRank: null, bestPos: null }; }
const DEFAULT_NAME = "Your club";
const midName = n => (n === DEFAULT_NAME ? "your club" : n);
function cleanName(v) { const s = typeof v === "string" ? v.replace(/\s+/g, " ").trim().slice(0, 24) : ""; return s || DEFAULT_NAME; }
function newGame(mode, seed, date) {
  return { mode: mode, seed: seed, date: date || null, league: makeLeague(seed), picks: { form: null, scored: null, defense: null, xg: null }, pos: 0, passPos: null, scoutPos: null, played: false, recorded: false, outcome: null };
}
function restoreGame(o, mode) {
  if (!o || typeof o !== "object" || typeof o.seed !== "string" || o.seed.length > 80) return null;
  const g = newGame(mode, o.seed, typeof o.date === "string" ? o.date : null), order = g.league.order, used = [];
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  for (const f of GAME_SLOTS) {
    const v = o.picks && o.picks[f.key];
    if (v == null) continue;
    if (!order.includes(v) || used.includes(v)) return newGame(mode, o.seed, g.date);
    g.picks[f.key] = v;
    used.push(v);
  }
  g.pos = int(o.pos, 0, order.length - 1) ? o.pos : 0;
  g.passPos = int(o.passPos, 0, order.length - 1) ? o.passPos : null;
  g.scoutPos = int(o.scoutPos, 1, order.length - 1) ? o.scoutPos : null;
  const expectedPos = used.length + (g.passPos != null ? 1 : 0) - (isComplete(g) ? 1 : 0);
  const consistent = g.pos === expectedPos && used.every(v => order.indexOf(v) <= g.pos) &&
    (g.passPos == null || (g.passPos <= g.pos && !used.includes(order[g.passPos]))) && (g.scoutPos == null || g.scoutPos <= g.pos + 1);
  if (!consistent) return newGame(mode, o.seed, g.date);
  g.played = o.played === true && isComplete(g);
  g.recorded = o.recorded === true;
  return g;
}
function initPlay() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(PLAY_KEY) || "null"); } catch (e) { s = null; }
  if (!s || typeof s !== "object") s = {};
  play.name = cleanName(s.name);
  play.record = blankRecord();
  if (s.record && typeof s.record === "object") {
    Object.keys(play.record).forEach(k => { const v = s.record[k]; if (Number.isInteger(v) && v >= 0 && v < 1e6) play.record[k] = v; });
  }
  const today = todayISO();
  play.games.daily = (s.daily && s.daily.date === today && s.daily.seed === "daily|" + today && restoreGame(s.daily, "daily")) || newGame("daily", "daily|" + today, today);
  play.games.practice = restoreGame(s.practice, "practice");
}
function savePlay() {
  const ser = g => g && { mode: g.mode, seed: g.seed, date: g.date, picks: g.picks, pos: g.pos, passPos: g.passPos, scoutPos: g.scoutPos, played: g.played, recorded: g.recorded };
  const data = { v: 1, name: play.name, record: play.record, daily: ser(play.games.daily), practice: ser(play.games.practice) };
  try { localStorage.setItem(PLAY_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable: the game still works for this visit */ }
}
function recordGame(g) {
  if (g.recorded) return;
  const o = g.outcome, r = play.record;
  r.played++;
  if (o.season.pos === 1) r.titles++;
  if (o.tier.key === "invincible") r.invincibles++;
  if (o.season.pos <= 4) r.top4++;
  if (o.rank === 1) r.perfect++;
  r.bestRank = r.bestRank == null ? o.rank : Math.min(r.bestRank, o.rank);
  r.bestPos = r.bestPos == null ? o.season.pos : Math.min(r.bestPos, o.season.pos);
  g.recorded = true;
}

function drawHistogram() {
  const el = document.getElementById("g-hist"), g = activeGame();
  if (!el || !g || !g.outcome) return;
  const o = g.outcome, hist = o.sims.hist, runs = o.sims.runs, n = hist.length - 1, mine = o.season.pos;
  const width = Math.max(260, Math.floor(el.clientWidth));
  play.histWidth = width;
  const narrow = width < 480, H = narrow ? 180 : 210, M = { t: 12, r: 4, b: 30, l: 40 };
  const w = width - M.l - M.r, h = H - M.t - M.b;
  const maxShare = Math.max.apply(null, hist.slice(1)) / runs;
  const step = maxShare > 0.5 ? 0.25 : maxShare > 0.2 ? 0.1 : 0.05;
  const top = Math.max(step, Math.ceil(maxShare / step - 1e-9) * step);
  const band = w / n, bw = Math.min(24, Math.max(4, band - 2)), y = v => M.t + h - (v / top) * h;
  const bar = (x, yv, bw_, r) => {
    const bh = M.t + h - yv;
    if (bh <= 0) return "";
    const rr = Math.min(r, bh, bw_ / 2), b = (M.t + h).toFixed(1);
    return `M${x.toFixed(1)} ${b}V${(yv + rr).toFixed(1)}Q${x.toFixed(1)} ${yv.toFixed(1)} ${(x + rr).toFixed(1)} ${yv.toFixed(1)}H${(x + bw_ - rr).toFixed(1)}Q${(x + bw_).toFixed(1)} ${yv.toFixed(1)} ${(x + bw_).toFixed(1)} ${(yv + rr).toFixed(1)}V${b}Z`;
  };
  let s = `<svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="Finishing positions across ${SIMS_TEXT} simulated seasons: won the league in ${pctWhole(o.sims.title)}, top four in ${pctWhole(o.sims.top4)}, average finish ${o.sims.avgPos.toFixed(1)}. This season: ${ordinal(mine)}.">`;
  for (let t = 0; t <= top + 1e-9; t += step) {
    s += `<line class="${t === 0 ? "c-axis" : "c-grid"}" x1="${M.l}" x2="${M.l + w}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
    s += `<text class="c-tick" x="${M.l - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${Math.round(t * 100)}%</text>`;
  }
  for (let p = 1; p <= n; p++) {
    const share = hist[p] / runs, cx = M.l + band * (p - 1) + band / 2, x = cx - bw / 2;
    if (hist[p]) s += `<path class="c-bar${p === mine ? " on" : ""}" d="${bar(x, Math.min(y(share), M.t + h - 1), bw, 4)}"/>`;
    if (!narrow || p === 1 || p % 5 === 0 || p === mine) s += `<text class="c-tick${p === mine ? " mine" : ""}" x="${cx.toFixed(1)}" y="${H - 10}" text-anchor="middle">${p}</text>`;
  }
  for (let p = 1; p <= n; p++) s += `<rect class="c-hit" data-p="${p}" x="${(M.l + band * (p - 1)).toFixed(1)}" y="${M.t}" width="${band.toFixed(1)}" height="${h}"/>`;
  s += "</svg>";
  el.innerHTML = s + '<div class="tooltip" hidden></div>';
  const tip = el.querySelector(".tooltip");
  el.querySelectorAll(".c-hit").forEach(r => {
    const show = () => {
      const p = +r.dataset.p, c = hist[p];
      el.querySelectorAll(".c-hit").forEach(x => x.classList.toggle("on", x === r));
      showTip(el, tip, `<b>${pctWhole(c / runs)}</b> of seasons<br>Finished ${ordinal(p)}: ${c} of ${SIMS_TEXT}${p === mine ? "<br>This season’s finish" : ""}`, M.l + band * (p - 0.5), y(c / runs));
    };
    r.addEventListener("pointerenter", show);
    r.addEventListener("pointerdown", show);
    r.addEventListener("pointerleave", () => { tip.hidden = true; r.classList.remove("on"); });
  });
}
function bindStripTips() {
  const wrap = document.getElementById("g-strip-wrap"), g = activeGame();
  if (!wrap || !g || !g.outcome) return;
  const tip = wrap.querySelector(".tooltip"), o = g.outcome;
  wrap.querySelectorAll(".g-chip").forEach(li => {
    const show = () => {
      const m = o.season.mine[+li.dataset.i], t = o.season.track[+li.dataset.i];
      const box = li.getBoundingClientRect(), wb = wrap.getBoundingClientRect();
      tip.textContent = "";

      b.textContent = `Matchday ${m.md}`;
      tip.append(b, document.createElement("br"), resultSentence(o, m), document.createElement("br"), `${t.pts} pts · ${ordinal(t.pos)} after this match`);
      tip.hidden = false;
      const tw = tip.offsetWidth, above = box.top - wb.top - tip.offsetHeight - 8;
      tip.style.left = Math.min(Math.max(0, box.left - wb.left + box.width / 2 - tw / 2), Math.max(0, wb.width - tw)) + "px";
      tip.style.top = (above >= 0 ? above : box.bottom - wb.top + 8) + "px";
      li.classList.add("hover");
    };
    li.addEventListener("pointerenter", show);
    li.addEventListener("pointerdown", show);
    li.addEventListener("pointerleave", () => { tip.hidden = true; li.classList.remove("hover"); });
  });
}

function finalText(g) {

function startSeason() {
  const g = activeGame();

  if (reduceMotion) { renderPlay(".g-tier"); keepInView(); announce(finalText(g)); return; }
  play.revealing = true;

}
function revealStep() {
  const g = activeGame();

  if (play.revealAt >= 38) return finishReveal();
  play.revealAt++;
  const o = g.outcome, i = play.revealAt - 1, t = o.season.track[i];
  const chip = document.querySelector(`#g-strip li[data-i="${i}"]`);
  if (chip) chip.classList.add("on");
  setText("#g-md", String(i + 1));

}

function setClubName(value, commit) {

const valueOf = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const numberOf = id => { const s = valueOf(id); return s === "" ? NaN : Number(s); };
function readLogForm() {
  const team = side => ({ name: valueOf(`lf-${side}-name`).replace(/\s+/g, " "), form: numberOf(`lf-${side}-form`), scored: numberOf(`lf-${side}-scored`), allowed: numberOf(`lf-${side}-allowed`), xg: numberOf(`lf-${side}-xg`) });
  return { gameweek: numberOf("lf-gw"), kickoff: valueOf("lf-kickoff"), home: team("home"), away: team("away") };
}
const statsComplete = t => [t.form, t.scored, t.allowed, t.xg].every(Number.isFinite);
const cleanTeam = t => ({ name: t.name, form: Math.round(t.form), scored: Math.round(t.scored * 100) / 100, allowed: Math.round(t.allowed * 100) / 100, xg: Math.round(t.xg * 100) / 100 });
function validateLog(f) {
  if (!Number.isInteger(f.gameweek) || f.gameweek < 1 || f.gameweek > 38) return "Enter a gameweek from 1 to 38.";
  if (!f.kickoff) return "Add the kickoff date and time.";
  const ko = new Date(f.kickoff);
  if (isNaN(ko)) return "The kickoff date isn’t valid.";
  if (ko.getTime() <= Date.now()) return "That kickoff time has passed. Predictions have to be logged before the match starts.";
  for (const side of ["home", "away"]) {
    const t = f[side];
    if (!t.name) return `Enter the ${side} team’s name.`;
    if (!Number.isInteger(t.form) || t.form < 0 || t.form > 15) return `Points for the ${side} team must be a whole number from 0 to 15.`;
    if (t.form === 14) return `14 points isn’t possible from five matches. Check the ${side} team’s results.`;
    for (const [k, lab] of [["scored", "goals scored"], ["allowed", "goals allowed"], ["xg", "xG"]]) {
      if (!Number.isFinite(t[k]) || t[k] < 0 || t[k] > 10) return `Enter the ${side} team’s ${lab} per game (0 to 10).`;
    }
  }
  if (f.home.name.toLowerCase() === f.away.name.toLowerCase()) return "The home and away teams must be different.";
  const dup = realMatches().some(m => m.home.name.toLowerCase() === f.home.name.toLowerCase() && m.away.name.toLowerCase() === f.away.name.toLowerCase() && Math.abs(Date.parse(m.kickoff) - ko.getTime()) < 36 * 3600e3);
  if (dup) return "This match is already logged.";
  return null;
}

  const f = readLogForm();
  if (!statsComplete(f.home) || !statsComplete(f.away)) {

  const v = currentVersion();

  const away = Object.assign(cleanTeam(f.away), { name: f.away.name || "Away team" });
  const p = predict(home, away, v);
  const fake = { home: home, away: away, modelVersion: v.id, prediction: p };
  box.innerHTML = html`<span class="label">Preview · model v${v.id}</span>${Call(p)}${ProbBar(p.probs)}<p class="fine">Model scores: ${home.name} ${p.scores.home.toFixed(1)}, ${away.name} ${p.scores.away.toFixed(1)} (gap ${signed(p.gap)}).</p><p class="fine">${explain(fake).join(" ")}</p>`.s;
}

async function submitLog() {

async function submitVersion() {
  const msg = $("#version-msg");
  const id = valueOf("vf-id"), date = valueOf("vf-date"), summary = valueOf("vf-summary");
  const changes = (document.getElementById("vf-changes").value || "").split("\n").map(s => s.trim()).filter(Boolean);

  const drawZone = numberOf("vf-draw"), scale = numberOf("vf-scale");
  if (!/^[0-9A-Za-z][0-9A-Za-z.\-]{0,11}$/.test(id)) return setMsg(msg, "Enter a version number such as 1.1.", "err");
  if (DATA.modelVersions.some(v => v.id === id)) return setMsg(msg, `Version ${id} already exists.`, "err");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return setMsg(msg, "Pick the date of this version.", "err");
  if (!summary) return setMsg(msg, "Add a one-line summary of the version.", "err");
  if (!FACTORS.every(f => Number.isInteger(weights[f.key]) && weights[f.key] >= 0)) return setMsg(msg, "Each weight must be a whole number of 0 or more.", "err");
